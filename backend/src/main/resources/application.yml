spring:
  application:
    name: barrier-free-campus
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barrierfreecampus}
    username: ${DB_USERNAME:barrierfree}
    password: ${DB_PASSWORD:barrierfree}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    secure-cookie: ${SECURE_COOKIE:false}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model-name: ${AI_MODEL_NAME:}
  analytics:
    building-score:
      accessible-entrance: 20
      elevator: 15
      accessible-toilet: 15
      road-accessibility: 25
      barrier-impact: 15
      data-completeness: 10
      proximity-meters: 100
