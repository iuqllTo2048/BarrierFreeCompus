services:
  db:
    image: postgis/postgis:17-3.5
    environment: { POSTGRES_DB: barrierfreecampus, POSTGRES_USER: barrierfree, POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, pg_isready -U barrierfree -d barrierfreecampus], interval: 5s, timeout: 5s, retries: 20 }
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/barrierfreecampus
      DB_USERNAME: barrierfree
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      SECURE_COOKIE: "${SECURE_COOKIE:-false}"
    ports: ["8081:8080"]
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
volumes: { postgres-data: {} }
